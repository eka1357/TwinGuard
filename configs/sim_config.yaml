# TwinGuard Simulation Configuration
simulation:
  model_path: "simulation/models/scene.xml"
  single_arm_model_path: "simulation/models/scene_single.xml"
  timestep: 0.002
  gravity: [0, 0, -9.81]
  integrator: "RK4"

robot:
  type: "SO-101"
  num_arms: 2
  arm_dof: 6
  canonical_joints:
    - joint_base_yaw
    - joint_shoulder_pitch
    - joint_elbow_pitch
    - joint_wrist_pitch
    - joint_wrist_roll
    - joint_gripper
  canonical_actuators:
    - actuator_base_yaw
    - actuator_shoulder_pitch
    - actuator_elbow_pitch
    - actuator_wrist_pitch
    - actuator_wrist_roll
    - actuator_gripper
  arms:
    left_arm:
      name: "left_arm"
      prefix: "left_arm_"
      base_pos: [0.0, 0.22, 0.42]
      joints:
        - "left_arm_joint_base_yaw"
        - "left_arm_joint_shoulder_pitch"
        - "left_arm_joint_elbow_pitch"
        - "left_arm_joint_wrist_pitch"
        - "left_arm_joint_wrist_roll"
        - "left_arm_joint_gripper"
      actuators:
        - "left_arm_actuator_base_yaw"
        - "left_arm_actuator_shoulder_pitch"
        - "left_arm_actuator_elbow_pitch"
        - "left_arm_actuator_wrist_pitch"
        - "left_arm_actuator_wrist_roll"
        - "left_arm_actuator_gripper"
    right_arm:
      name: "right_arm"
      prefix: "right_arm_"
      base_pos: [0.0, -0.22, 0.42]
      joints:
        - "right_arm_joint_base_yaw"
        - "right_arm_joint_shoulder_pitch"
        - "right_arm_joint_elbow_pitch"
        - "right_arm_joint_wrist_pitch"
        - "right_arm_joint_wrist_roll"
        - "right_arm_joint_gripper"
      actuators:
        - "right_arm_actuator_base_yaw"
        - "right_arm_actuator_shoulder_pitch"
        - "right_arm_actuator_elbow_pitch"
        - "right_arm_actuator_wrist_pitch"
        - "right_arm_actuator_wrist_roll"
        - "right_arm_actuator_gripper"
  gripper:
    open_pos: 40.0
    closed_pos: 0.0

cameras:
  overview_cam:
    name: "overview_cam"
    width: 1280
    height: 720
  front_cam:
    name: "front_cam"
    width: 640
    height: 480
  left_arm_wrist_cam:
    name: "left_arm_wrist_cam"
    width: 640
    height: 480
  right_arm_wrist_cam:
    name: "right_arm_wrist_cam"
    width: 640
    height: 480

primitives:
  position_tolerance: 0.02          # meters (2cm end-effector reach tolerance)
  angle_tolerance_deg: 10.0         # degrees orientation tolerance
  ik_max_iterations: 150            # maximum iterations for Jacobian IK solver
  ik_damping: 0.05                  # DLS damping factor lambda
  ik_step_size: 0.5                 # gradient step size / scaling
  ik_pos_threshold: 0.005           # IK convergence distance in meters (5mm)
  primitive_step_limit: 300         # simulation physics steps per primitive
  pour_tilt_angle_deg: 45.0         # minimum tilt angle for geometric pour proxy
  pour_hold_steps: 50               # steps to hold pour tilt over container
  pour_height_offset: 0.12          # height above container for pour action
  lift_default_height: 0.08         # default vertical lift distance in meters
  drawer_pull_distance: 0.06        # distance in meters to pull drawer handle

planning:
  llm:
    model: "gemini-2.5-flash"         # Configurable LLM model identifier
    provider: "mock"                  # Default provider ("mock", "gemini", "openai")
    temperature: 0.0                  # Generation temperature
    max_tokens: 1024                  # Max token generation limit
    retry_on_validation_error: true   # Retry once if schema validation fails
    max_retries: 1                    # Number of retries on validation failure

evaluation:
  benchmark:
    num_iterations: 100               # Number of benchmark inference runs
    warmup_iterations: 10             # Warmup cycles before timing
    device: "CPU"                     # OpenVINO target device ('CPU', 'GPU', 'NPU')
